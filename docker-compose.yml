services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: print
      POSTGRES_PASSWORD: print
      POSTGRES_DB: printorder
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U print -d printorder"]
      interval: 3s
      timeout: 3s
      retries: 20
